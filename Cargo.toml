[package]
name = "pdfium"
version = "0.10.1"
edition = "2021"
rust-version = "1.87"
description = "Modern Rust interface to PDFium, the PDF library from Google"
keywords = ["pdf", "pdfium"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/newinnovations/pdfium-rs"
homepage = "https://github.com/newinnovations/pdfium-rs"
exclude = ["resources/*.pdf"]

[dependencies]
bitflags = "2.10.0"
libloading = "0.8.9"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
parking_lot = "0.12.5"

[features]
# default = ["debug_print"]
debug_print = []
